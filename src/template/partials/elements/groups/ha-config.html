<div class="group-wrapper">
    <div class="ha-enable-card">
        <label class="ha-enable-label">
            <input type="checkbox" id="serverhighavailability" name="serverhighavailability">
            <div class="ha-enable-content">
                <div class="ha-enable-text">
                    <span class="ha-enable-title">High Availability aktiviert</span>
                    <span class="ha-enable-desc">Ausfallsicherheit und Redundanz durch HA/Clustering</span>
                </div>
            </div>
        </label>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label>HA-Modus</label>
            <div class="custom-select" data-name="hamode">
                <div class="select-trigger">
                    <span class="placeholder">Bitte wählen</span>
                    <span class="arrow">▼</span>
                </div>
                <div class="select-dropdown">
                    <div class="select-options">
                        <div class="select-option" data-value="">Bitte wählen</div>
                        <div class="select-option" data-value="active-passive">Active-Passive</div>
                        <div class="select-option" data-value="active-active">Active-Active</div>
                        <div class="select-option" data-value="cluster">Cluster</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="form-group">
            <label>Partner / Standby-Gerät</label>
            <input type="text" id="hapartner" name="hapartner" placeholder="Hostname oder IP des HA-Partners">
        </div>
    </div>
</div>
