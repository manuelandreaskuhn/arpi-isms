<div class="group-wrapper">
    <div class="subsection-header">Server-Referenz</div>

    <div class="form-row">
        <div class="form-group">
            <label>Backup-Server / VM</label>
            <div class="custom-select" data-name="serverid" data-component-type="system">
                <div class="select-trigger">
                    <span class="placeholder">Server / VM wählen</span>
                    <span class="arrow">▼</span>
                </div>
                <div class="select-dropdown">
                    <div class="select-options">
                        <div class="select-option" data-value="">Keine Verknüpfung</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="form-group">
            <label>Server-Name (manuell)</label>
            <input type="text" id="serverhostname" name="serverhostname" placeholder="Hostname des Servers">
        </div>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label>IP-Adresse</label>
            <input type="text" id="serverip" name="serverip" placeholder="z.B. 10.0.0.1">
        </div>
    </div>
</div>
