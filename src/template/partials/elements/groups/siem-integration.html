<div class="group-wrapper">
    <div class="subsection-header">SIEM-Integration</div>

    <div class="form-row">
        <div class="form-group">
            <label>SIEM-System</label>
            <div class="custom-select" data-name="siemid" data-component-type="siem">
                <div class="select-trigger">
                    <span class="placeholder">SIEM-Komponente wählen</span>
                    <span class="arrow">▼</span>
                </div>
                <div class="select-dropdown">
                    <div class="select-options">
                        <div class="select-option" data-value="">Keine Verknüpfung</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="form-group">
            <label>SIEM (manuell)</label>
            <input type="text" id="siem_manual" name="siem_manual" placeholder="SIEM-System manuell angeben">
        </div>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label>Log-Format</label>
            <div class="custom-select" data-name="siemlogformat">
                <div class="select-trigger">
                    <span class="placeholder">Bitte wählen</span>
                    <span class="arrow">▼</span>
                </div>
                <div class="select-dropdown">
                    <div class="select-options">
                        <div class="select-option" data-value="">Bitte wählen</div>
                        <div class="select-option" data-value="syslog">Syslog</div>
                        <div class="select-option" data-value="json">JSON</div>
                        <div class="select-option" data-value="cef">CEF</div>
                        <div class="select-option" data-value="leef">LEEF</div>
                        <div class="select-option" data-value="custom">Custom</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="form-group">
            <label>Transport-Protokoll</label>
            <div class="custom-select" data-name="siemtransportprotocol">
                <div class="select-trigger">
                    <span class="placeholder">Bitte wählen</span>
                    <span class="arrow">▼</span>
                </div>
                <div class="select-dropdown">
                    <div class="select-options">
                        <div class="select-option" data-value="">Bitte wählen</div>
                        <div class="select-option" data-value="tcp">TCP</div>
                        <div class="select-option" data-value="udp">UDP</div>
                        <div class="select-option" data-value="tls">TLS</div>
                        <div class="select-option" data-value="https">HTTPS</div>
                        <div class="select-option" data-value="beats">Beats</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
