<div class="group-wrapper">
    <div class="subsection-header">DHCP-Konfiguration</div>

    <div class="form-row">
        <div class="form-group">
            <label>DHCP aktiviert</label>
            <div class="custom-select" data-name="dhcpenabled">
                <div class="select-trigger">
                    <span class="placeholder">Bitte wählen</span>
                    <span class="arrow">▼</span>
                </div>
                <div class="select-dropdown">
                    <div class="select-options">
                        <div class="select-option" data-value="">Bitte wählen</div>
                        <div class="select-option" data-value="yes">Ja</div>
                        <div class="select-option" data-value="no">Nein (statische IPs)</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="form-group">
            <label>DHCP-Server</label>
            <input type="text" id="dhcpserver" name="dhcpserver" placeholder="IP oder Hostname des DHCP-Servers">
        </div>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label>DHCP-Pool (Start)</label>
            <input type="text" id="dhcpstart" name="dhcpstart" placeholder="192.168.1.10">
        </div>
        <div class="form-group">
            <label>DHCP-Pool (Ende)</label>
            <input type="text" id="dhcpend" name="dhcpend" placeholder="192.168.1.254">
        </div>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label>DHCP-Lease-Zeit</label>
            <input type="text" id="dhcplease" name="dhcplease" placeholder="z.B. 24h, 1d, 8h">
        </div>
        <div class="form-group">
            <label>DHCP-Reservierungen</label>
            <input type="text" id="dhcpreservations" name="dhcpreservations"
                placeholder="Feste IP-Zuweisungen nach MAC-Adresse">
        </div>
    </div>
</div>
