<div class="group-wrapper">
    <div class="subsection-header">Verantwortlichkeiten &amp; Support</div>

    <div class="form-row">
        <div class="form-group">
            <label>Administrator</label>
            <input type="text" id="admin" name="admin" placeholder="Name oder E-Mail des Administrators">
        </div>
        <div class="form-group">
            <label>Support-Vertrag</label>
            <input type="text" id="supportcontract" name="supportcontract"
                placeholder="Vertragsnummer oder Bezeichnung">
        </div>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label>Support-Kontakt</label>
            <input type="text" id="supportcontact" name="supportcontact"
                placeholder="Telefon, E-Mail oder Ticket-Portal">
        </div>
        <div class="form-group">
            <label>Support-Vertragsende</label>
            <input type="date" id="supportend" name="supportend">
        </div>
    </div>
</div>
